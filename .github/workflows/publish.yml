# Build Cooklang recipes into a static site and publish to GitHub Pages.
# One-time setup: Settings → Pages → Source = GitHub Actions
# Live URL: https://levison.github.io/cookbook/

name: Publish Recipes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install CookCLI
        run: |
          curl -fsSL -o cook.tar.gz \
            https://github.com/cooklang/cookcli/releases/latest/download/cook-x86_64-unknown-linux-gnu.tar.gz
          tar xz -f cook.tar.gz
          sudo mv cook /usr/local/bin/
          cook --version

      - name: Build site
        run: >
          cook build web
          --base-path recipes
          --base-url /cookbook/
          --repo-url https://github.com/Levison/cookbook
          --sitemap https://levison.github.io/cookbook

      - name: Add mobile grocery list
        run: bash site-enhancements/inject.sh ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
